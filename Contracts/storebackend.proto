syntax = "proto3";

option csharp_namespace = "StoreBackend.Contracts";

package storebackend;

// Interner Prozessvertrag zwischen WarehouseService und StoreBackend.
service WarehouseStorage {
  rpc GetProducts (BackendProductsRequest) returns (BackendProductsResponse);
  rpc ReserveProducts (BackendProductQuantitiesRequest) returns (BackendStockChangeResponse);
  rpc ReleaseProducts (BackendProductQuantitiesRequest) returns (BackendStockChangeResponse);
  rpc GetStatus (BackendStatusRequest) returns (BackendStatusResponse);
}

message BackendProductsRequest {}

message BackendProductsResponse {
  repeated StoredProduct products = 1;
}

message StoredProduct {
  string id = 1;
  string name = 2;
  int64 price_in_cents = 3;
  string image = 4;
  int32 available_quantity = 5;
  bool is_sold_out = 6;
}

message BackendProductQuantitiesRequest {
  repeated BackendProductQuantity items = 1;
}

message BackendProductQuantity {
  string product_id = 1;
  int32 quantity = 2;
}

message BackendStockChangeResponse {
  bool success = 1;
  repeated BackendProductStock products = 2;
  string message = 3;
}

message BackendStatusRequest {}

message BackendStatusResponse {
  bool available = 1;
  string service = 2;
}

message BackendProductStock {
  string product_id = 1;
  int32 available_quantity = 2;
  bool is_sold_out = 3;
}
