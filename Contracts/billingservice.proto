syntax = "proto3";

option csharp_namespace = "VstOnlineStore.Contracts.BillingService";

package billingservice;

service BillingOperations {
  rpc ProcessPayment (PaymentRequest) returns (PaymentResponse);
  rpc RefundPayment (RefundPaymentRequest) returns (RefundPaymentResponse);
  rpc GetPaymentStatus (PaymentStatusRequest) returns (PaymentStatusResponse);
  rpc ListPaymentProviders (PaymentProvidersRequest) returns (PaymentProvidersResponse);
  rpc GetStatus (BillingStatusRequest) returns (BillingStatusResponse);
}

message PaymentRequest {
  reserved 5;
  reserved "payment_provider";

  int64 amount_in_cents = 1;
  string currency = 2;
  string payment_method = 3;
  string reference = 4;
  string customer_email = 6;
  repeated PaymentLineItem invoice_items = 7;
  string order_id = 8;
  string provider_key = 9;
}

message PaymentResponse {
  bool success = 1;
  string transaction_id = 2;
  string provider = 3;
  string message = 4;
  string invoice_id = 5;
  bool invoice_queued = 6;
}

message PaymentLineItem {
  string product_id = 1;
  string description = 2;
  int32 quantity = 3;
  int64 unit_price_in_cents = 4;
}

message PaymentProvidersRequest {}

message PaymentProvidersResponse {
  repeated PaymentProviderInfo providers = 1;
}

message PaymentProviderInfo {
  string key = 1;
  string name = 2;
  bool is_test_mode = 3;
  bool is_active = 4;
  bool is_enabled = 5;
}

message RefundPaymentRequest {
  string transaction_id = 1;
  int64 amount_in_cents = 2;
}

message RefundPaymentResponse {
  bool success = 1;
  string transaction_id = 2;
  int64 refunded_amount_in_cents = 3;
  int64 total_refunded_amount_in_cents = 4;
  PaymentTransactionStatus status = 5;
  string message = 6;
}

message PaymentStatusRequest {
  string transaction_id = 1;
}

message PaymentStatusResponse {
  bool found = 1;
  string transaction_id = 2;
  string order_id = 3;
  int64 amount_in_cents = 4;
  int64 refunded_amount_in_cents = 5;
  string currency = 6;
  PaymentTransactionStatus status = 7;
  string message = 8;
}

enum PaymentTransactionStatus {
  PAYMENT_TRANSACTION_STATUS_UNSPECIFIED = 0;
  PAYMENT_TRANSACTION_STATUS_PENDING = 1;
  PAYMENT_TRANSACTION_STATUS_SUCCEEDED = 2;
  PAYMENT_TRANSACTION_STATUS_FAILED = 3;
  PAYMENT_TRANSACTION_STATUS_PARTIALLY_REFUNDED = 4;
  PAYMENT_TRANSACTION_STATUS_REFUNDED = 5;
}

message BillingStatusRequest {}

message BillingStatusResponse {
  bool available = 1;
  string service = 2;
}
