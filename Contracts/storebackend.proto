syntax = "proto3";

option csharp_namespace = "StoreBackend.Contracts";

package storebackend;

// Interner Prozessvertrag zwischen WarehouseService und StoreBackend.
service WarehouseStorage {
  rpc GetProducts (BackendProductsRequest) returns (BackendProductsResponse);
  rpc ReserveProduct (BackendReserveProductRequest) returns (BackendReserveProductResponse);
}

message BackendProductsRequest {
}

message BackendProductsResponse {
  repeated StoredProduct products = 1;
}

message StoredProduct {
  string id = 1;
  string name = 2;
  int64 price_in_cents = 3;
  string image = 4;
  int32 available_quantity = 5;
  bool is_sold_out = 6;
}

message BackendReserveProductRequest {
  string product_id = 1;
  int32 quantity = 2;
}

message BackendReserveProductResponse {
  bool success = 1;
  string product_id = 2;
  int32 available_quantity = 3;
  bool is_sold_out = 4;
  string message = 5;
}
