syntax = "proto3";

option csharp_namespace = "VstOnlineStore.Contracts.WarehouseService";

package warehouseservice;

// Vom ShopService verwendete Warehouse-Servicegrenze.
service WarehouseCatalog {
  rpc GetFeaturedProducts (FeaturedProductsRequest) returns (FeaturedProductsResponse);
  rpc ReserveCart (CartStockRequest) returns (CartStockResponse);
  rpc CommitCart (CartStockRequest) returns (CartStockResponse);
  rpc ReleaseCart (CartStockRequest) returns (CartStockResponse);
  rpc GetStatus (WarehouseStatusRequest) returns (WarehouseStatusResponse);
}

message FeaturedProductsRequest {}

message FeaturedProductsResponse {
  repeated WarehouseProduct products = 1;
}

message WarehouseProduct {
  string id = 1;
  string name = 2;
  int64 price_in_cents = 3;
  string image = 4;
  int32 available_quantity = 5;
  bool is_sold_out = 6;
}

message CartStockRequest {
  repeated CartProductQuantity items = 1;
  string reservation_id = 2;
  string presentation_scenario = 3;
}

message CartProductQuantity {
  string product_id = 1;
  int32 quantity = 2;
}

message CartStockResponse {
  bool success = 1;
  repeated CartProductStock products = 2;
  string message = 3;
}

message CartProductStock {
  string product_id = 1;
  int32 available_quantity = 2;
  bool is_sold_out = 3;
  string name = 4;
  int64 price_in_cents = 5;
}

message WarehouseStatusRequest {}

message WarehouseStatusResponse {
  bool available = 1;
  string service = 2;
}
