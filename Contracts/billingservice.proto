syntax = "proto3";

option csharp_namespace = "VstOnlineStore.Contracts.BillingService";

package billingservice;

service BillingOperations {
  rpc ProcessPayment (PaymentRequest) returns (PaymentResponse);
  rpc ListPaymentProviders (PaymentProvidersRequest) returns (PaymentProvidersResponse);
  rpc GetStatus (BillingStatusRequest) returns (BillingStatusResponse);
}

message PaymentRequest {
  int64 amount_in_cents = 1;
  string currency = 2;
  string payment_method = 3;
  string reference = 4;
  string payment_provider = 5;
  string customer_email = 6;
  repeated PaymentLineItem invoice_items = 7;
}

message PaymentResponse {
  bool success = 1;
  string transaction_id = 2;
  string provider = 3;
  string message = 4;
  string invoice_id = 5;
  bool invoice_queued = 6;
}

message PaymentLineItem {
  string product_id = 1;
  string description = 2;
  int32 quantity = 3;
  int64 unit_price_in_cents = 4;
}

message PaymentProvidersRequest {}

message PaymentProvidersResponse {
  repeated PaymentProviderInfo providers = 1;
}

message PaymentProviderInfo {
  string key = 1;
  string name = 2;
  bool is_test_mode = 3;
}

message BillingStatusRequest {}

message BillingStatusResponse {
  bool available = 1;
  string service = 2;
}
